<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="color-scheme" content="dark">

<link rel="stylesheet" href="style.css">

</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="26 26 58 58" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD15C"/><stop offset="1" stop-color="#FF7A1A"/></linearGradient></defs>
      <circle cx="54" cy="54" r="27" fill="none" stroke="#FFB020" stroke-opacity=".22" stroke-width="1.5"/>

      <circle cx="53" cy="47.5" r="3.4" fill="#05070D"/><circle cx="54.2" cy="46.4" r="1.1" fill="#FFF3D6"/>
    </svg>
    <div class="wordmark">Pool<b>Hawk</b></div>
  </div>
  <div class="top-actions">
    <button id="proBtn" class="pro-btn">PRO</button>
    <button id="setBtn" class="icon-btn" aria-label="Settings">

    </button>
  </div>
</header>

<div class="search">

</div>

<main id="view"></main>

  <button data-tab="new"><svg viewBox="0 0 24 24"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7L12 2Zm7 13 1 2.6 2.5 1-2.5 1-1 2.4-1-2.4-2.5-1 2.5-1 1-2.6Z"/></svg><span data-t="tab_new"></span></button>

      <circle cx="54" cy="54" r="27" fill="none" stroke="#FFB020" stroke-opacity=".22" stroke-width="1.5"/>
