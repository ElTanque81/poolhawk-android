name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Preferred: repository secrets. Fallback: the key kept in this private repo (signing/).
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          elif [ -f signing/release.jks ]; then
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/release.jks" >> "$GITHUB_ENV"
            echo "::add-mask::$(cat signing/password.txt)"
            echo "KEYSTORE_PASSWORD=$(cat signing/password.txt)" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key found: the APK is signed with a temporary debug key."
          fi

      - name: Test and build
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Check the APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump permissions "$APK" | tee permissions.txt
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -5
          cp "$APK" PoolHawk.apk
          ls -la PoolHawk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PoolHawk-apk
          path: |
            PoolHawk.apk
            permissions.txt

      - name: Publish the APK to the "builds" branch
        if: github.ref == 'refs/heads/main'
        run: |
          # One commit that always holds the newest APK: https://github.com/${{ github.repository }}/tree/builds
          mkdir out && cp PoolHawk.apk permissions.txt out/ && cd out
          echo "Built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%MZ)" > BUILD.txt
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "PoolHawk APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
