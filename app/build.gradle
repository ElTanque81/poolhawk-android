plugins {
    id 'com.android.application'
}

// Release signing: the build server passes the keystore through these variables.
def keystoreFile = System.getenv('KEYSTORE_FILE')

android {
    namespace 'app.poolhawk'
    compileSdk 34

    defaultConfig {
        applicationId 'app.poolhawk'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '1.5'
    }

    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'poolhawk'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    // Solana Mobile Wallet Adapter: lets Phantom, Solflare and other wallets sign swaps; keys never enter PoolHawk
    implementation 'com.solanamobile:mobile-wallet-adapter-clientlib:2.0.3'
    testImplementation 'junit:junit:4.13.2'
    // real org.json for unit tests (Android's copy is only a stub on the JVM)
    testImplementation 'org.json:json:20231013'
}
