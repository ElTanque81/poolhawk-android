plugins {
    id 'com.android.application'
}

// Release signing: the build server passes the keystore through these variables.
def keystoreFile = System.getenv('KEYSTORE_FILE')

android {
    namespace 'app.poolhawk'
    compileSdk 34

    defaultConfig {
        applicationId 'app.poolhawk'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'poolhawk'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    // No libraries: the app uses only what Android itself provides.
    testImplementation 'junit:junit:4.13.2'
}
